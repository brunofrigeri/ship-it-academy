<style>
/* shown until the course script renders: same header, loading only in the content */
.boot-top{display:flex;align-items:center;gap:14px;padding:12px 18px;border-bottom:1px solid #e4def5;font:700 16px Sora,system-ui,sans-serif;color:#1d1640}
.boot-sw{display:flex;gap:4px;padding:4px;border:1px solid #1d1640;border-radius:12px;font-size:13px}
.boot-sw a{padding:6px 12px;border-radius:9px;color:inherit;text-decoration:none}.boot-sw a.on{background:#6b4eff;color:#fff}
.boot-main{display:grid;justify-items:center;gap:16px;padding:40px 16px;font:500 14px Sora,system-ui,sans-serif;color:#6a6488}
.boot-spin{width:22px;height:22px;border-radius:50%;border:3px solid #e4def5;border-top-color:#6b4eff;animation:bs .8s linear infinite}
.boot-sk{display:grid;gap:12px;width:min(900px,100%)}.boot-sk i{height:64px;border-radius:14px;background:#f1edfb}.boot-sk i:first-child{height:120px}
@keyframes bs{to{transform:rotate(360deg)}}
@media (prefers-color-scheme:dark){body{background:#15121f}.boot-top{color:#eee;border-color:#2c2640}.boot-sw{border-color:#888}.boot-sk i{background:#221d33}}
</style>
</head>
<body>
<div id="app"><header class="boot-top"><span>ship_it() Academy</span><nav class="boot-sw"><a href="../">⚡ Game</a><a class="on" href="./">🎓 Course</a></nav></header><main class="boot-main"><div class="boot-spin" aria-hidden="true"></div><span>Loading the course…</span><div class="boot-sk"><i></i><i></i><i></i></div></main></div>
<noscript>This course needs JavaScript.</noscript>
<script type="module" src="/src/course/main.js"></script>
</body>
